name: 'Soak sticky comment'
description: 'Create or update the sticky soak comparison comment on the PR that triggered the workflow.'

# Shared by the early "Soak running" comment and the final verdict in
# soak_pr.yml. The caller gates it on the permission check and the head
# pin; this action does not check them. It is read from the workspace, so
# it runs only after the workspace is back on the BASE tree.

inputs:
  body-file:
    description: 'Path of the comment body. Its first line must be the marker.'
    required: true

runs:
  using: "composite"
  steps:
    - name: Find or create the marker comment
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BODY_FILE: ${{ inputs.body-file }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.issue.number }}
      run: |
        MARKER="<!-- rpcn-soak-comparison -->"

        # 1. The body must carry the marker, or the next run cannot find it.
        if [ "$(head -n1 "$BODY_FILE")" != "$MARKER" ]; then
          echo "::error::comment body must start with the marker"
          exit 1
        fi

        # 2. Find the bot's own marker comment. Filter on the author: anyone
        #    can pre-plant a comment that starts with the marker, and they
        #    would keep edit rights over it if we picked it up.
        #    awk, not `head -1`: head closes the pipe early and turns a
        #    multi-page listing into SIGPIPE (141) under pipefail.
        EXISTING=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
          --jq ".[] | select((.body | startswith(\"$MARKER\")) and .user.login == \"github-actions[bot]\") | .id" \
          | awk 'NR==1')

        # 3. Update it if found, else create it.
        if [ -n "$EXISTING" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" -F body=@"$BODY_FILE" >/dev/null
        else
          gh api "repos/$REPO/issues/$PR/comments" -F body=@"$BODY_FILE" >/dev/null
        fi
