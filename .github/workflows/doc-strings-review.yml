---
# Suggest-only review of user-facing doc strings in component and Bloblang
# specs. These strings are published to the Redpanda Connect reference on
# docs.redpanda.com, generated by cmd/tools/docs_gen.
#
# All review logic lives in the shared reusable workflow in
# redpanda-data/docs-extensions-and-macros so it cannot drift between
# repos. This shim owns only the trigger paths and the secrets.
#
# The ref is pinned to a commit SHA, not a branch. The reusable workflow
# runs here with pull-requests: write and id-token: write, and through
# that OIDC role it can read every secret granted to this repo in Secrets
# Manager, the org bot token included. Tracking a branch would let a merge
# in docs-extensions-and-macros change what runs inside this repo's job
# without any review here. "Suggest-only and fails open" bounds what the
# review can do to a PR, not what a run step can do with the role.
# A tag is no better: the ruleset protecting v* tags there is scoped to
# that repository, so an admin there can edit it and move a tag with no
# review on our side. Pin the commit SHA, annotated with the tag for a
# human to read.
#
# To bump: take the release commit (the one a v<version> tag points at) on
# docs-extensions-and-macros main that carries the change you want, check
# its diff to .github/workflows/doc-strings-review.yml, and update the SHA,
# its tag comment, and the date below in one PR.
name: doc-strings-review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # The reusable workflow's diff scan decides whether a PR has anything to
    # review, and a push that adds or changes no doc string the review has
    # not already seen never reaches the model.
    paths:
      - "internal/**/*.go"
      - "public/**/*.go"
# Queue, never cancel: a review cancelled mid-post leaves half its
# suggestions up and skips saving the record of what it reviewed, so the
# next run repeats them. GitHub keeps only the newest queued run, so a
# burst of pushes still ends in one review of the latest commit.
concurrency:
  group: doc-strings-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  review:
    # Same-repo PRs only. A fork PR gets no OIDC role and no secrets, so the
    # gateway mint could not run and the review could only ever be lint-only
    # noise on an external contributor's PR. The tamper guard would also see
    # every fork author as a non-writer and refuse. Gating here keeps that
    # from looking like a failure the contributor caused.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    # v5.56.0 (2026-10-26): the connect surface checks env-cloud
    # conditionals in spec strings and rejects whitespace inside a
    # conditional directive's brackets. Lines that a human reviewer other
    # than the author wrote on the PR are not reviewed again.
    # The reusable workflow resolves the doc-tools CLI version from its own
    # ref, so this SHA pins the review logic and the CLI together and a bump
    # moves both.
    uses: redpanda-data/docs-extensions-and-macros/.github/workflows/doc-strings-review.yml@90ebfd5ceb8824915c8ab9ee440d79a975933976 # v5.56.0
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    with:
      # The AWS inputs let the reusable workflow assume this repo's OIDC role
      # and read the org bot token from Secrets Manager, the same way this
      # repo's release workflows do.
      aws_region: ${{ vars.RP_AWS_CRED_REGION }}
      aws_role_name_prefix: ${{ vars.RP_AWS_CRED_BASE_ROLE_NAME }}
      # Model traffic goes through the ADP AI Gateway, minted as the
      # doc-strings-review agent, so Cost and usage attributes this review's
      # spend to that agent by name. devprod-infra grants this repo the
      # agent's credential (sdlc/prod/github/docs_doc_strings_client). Every
      # step in the mint chain is continue-on-error, so a missing grant shows
      # up as a review that silently does not appear. Read the job log, not
      # the check color.
      use_adp_gateway: true
      # Sonnet 5, about 0.4x Opus 5's cost per run. On the review's own eval
      # suite (docs-extensions-and-macros evals/doc-strings, production
      # prompt) it matched Opus except for one C++ line over the 80-column
      # limit, which connect's Go strings do not have. It is on the
      # claude-code-provider-adp allowlist: docs-site's doc-impact match check
      # runs on it through the same provider. A model the provider does not
      # allow is a 400 that surfaces as a missing review rather than a
      # failure, so pin it here rather than rely on the reusable default.
      gateway_model: us.anthropic.claude-sonnet-5
      surfaces: connect
    secrets:
      # No anthropic_api_key: the reusable workflow only reads it when
      # use_adp_gateway is off, so passing it would just expose a long-lived
      # key to a job that runs a model with Bash over PR content. No
      # actions_bot_token either: the reusable workflow reads the bot token
      # over OIDC from the AWS inputs above.
      aws_cred_account_id: ${{ secrets.RP_AWS_CRED_ACCOUNT_ID }}
