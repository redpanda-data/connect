# Fails when .github/workflows/actions.lock does not agree with the workflows, or when a locked pin
# no longer resolves upstream. Without this check the lockfile only records what the author of a
# pull request resolved on their machine.
#
# The path filter keeps the job off pull requests that do not touch Actions. A required check with a
# path filter stays pending on the pull requests it skips, so remove the filter before you make this
# check required.

name: verify-lockfile

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      # The extension is pinned. An unpinned extension would run code that the lockfile does not cover.
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1

      # `--verify-local` is the offline coverage check: it confirms that every action reference has a
      # lockfile entry. The full `--verify` also reads each action upstream, which fails on a hosted
      # runner because the `aquasecurity` organization (trivy-action) has an IP allow list that rejects
      # runner addresses. Run `gh actions-lock --verify` on a workstation to check the entries upstream.
      - name: Verify lockfile coverage
        run: gh actions-lock --verify-local
