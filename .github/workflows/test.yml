name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 1
    steps:
      # The test build failed with "no space left on device" in January 2026 (#3906).
      # In October 2026 the runner starts with 86 to 92 GiB free and the job uses 11 to 14 GiB at peak (#4927).
      # The 40 GiB limit covers the job, the restored Go cache, and its archive during restore.
      # If free space is low, delete the directories with the fewest files per GiB: rm time follows the file count.
      # Do not delete /usr/local/lib/android: it has ~311k files and takes 70 s to 280 s to delete.
      - name: Free disk space if low
        run: |
          df -h /
          if [ "$(df -BG --output=avail / | tail -1 | tr -dc 0-9)" -lt 40 ]; then
            sudo rm -rf /usr/share/swift /usr/local/share/powershell /usr/local/.ghcup /usr/share/dotnet
            df -h /
          fi

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # TestNewSpecsHaveVersions reads the previous release tag.
          fetch-depth: 0
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libzmq3-dev

      - name: Install Task
        uses: ./.github/actions/setup-task

      - name: Deps
        run: task deps && git diff HEAD -- go.mod go.sum && git diff-index HEAD --exit-code

      - name: Test
        run: task test

  # Generates the reference docs with every component and lints every config
  # snippet. A job of its own, so it runs alongside the unit tests.
  docs:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 1
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell
          sudo docker image prune --all --force

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # TestNewSpecsHaveVersions reads the release tags.
          fetch-depth: 0
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libzmq3-dev

      - name: Install Task
        uses: ./.github/actions/setup-task

      - name: Docs
        run: CGO_ENABLED=1 TAGS=x_benthos_extra task docs

      - name: Check that task docs left tracked files unchanged
        run: test -z "$(git ls-files --others --modified --exclude-standard)" || { >&2 echo "task docs changed tracked files, such as internal/plugins/info.csv. Run 'CGO_ENABLED=1 TAGS=x_benthos_extra task docs' and commit the result (see docs/README.md)."; git status --short >&2; exit 1; }

      # The docs check below builds the docs site with this tree.
      - name: Upload the generated docs
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: connect-docs-head
          path: docs/modules
          retention-days: 7

  # The same tree at the PR's merge base, so the docs check can list the
  # published pages this PR changes. Generated here rather than taken from a
  # main build: main may have moved on since the PR branched.
  docs-base:
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check out the merge base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git checkout --quiet "$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libzmq3-dev
      - name: Generate the reference docs
        run: go run -tags x_benthos_extra ./cmd/tools/docs_gen
      - name: Upload the generated docs
        uses: actions/upload-artifact@v4
        with:
          name: connect-docs-base
          path: docs/modules
          retention-days: 7

  # Builds the Connect docs with this PR's generated tree and checks the
  # result: Antora errors, broken anchors, and unconverted markup on the
  # pages the PR changes block. When the PR changes a published page, it
  # comments with the changed pages and a preview link, and asks the docs
  # team to review. See docs/README.md.
  docs-check:
    needs: [docs, docs-base]
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
      statuses: write
      pull-requests: write
    uses: redpanda-data/docs-extensions-and-macros/.github/workflows/connect-docs-check.yml@817a5381ebf4f978941ad79d5c15139599d9a2e8
    with:
      docs_artifact: connect-docs-head
      base_docs_artifact: connect-docs-base
      aws_region: ${{ vars.RP_AWS_CRED_REGION }}
      aws_role_name_prefix: ${{ vars.RP_AWS_CRED_BASE_ROLE_NAME }}
    secrets:
      aws_cred_account_id: ${{ secrets.RP_AWS_CRED_ACCOUNT_ID }}

  golangci-lint:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Set version env variables
        run: cat .versions >> $GITHUB_ENV

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: "v${{env.GOLANGCI_LINT_VERSION}}"
          args: "--timeout=30m cmd/... internal/... public/..."
          skip-cache: true
          skip-save-cache: true

  test-benchmarking:
    # The benchmarking harness lives in standalone Go modules
    # (benchmarking/aws and benchmarking/aws/cleanup-lambda) so its AWS SDK
    # deps stay out of the published root module — which also makes it
    # invisible to the root `task test` / lint / tidy checks above. This job
    # is its gate: tests, tidy drift, and lint for both modules.
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      # Use a separate cache key. With the default key (root go.sum), this job saves first, and test and
      # golangci-lint then restore a cache without the root module's build output.
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'benchmarking/aws/go.mod'
          cache-dependency-path: 'benchmarking/aws/**/go.sum'

      - name: Deps
        run: |
          (cd benchmarking/aws && go mod tidy)
          (cd benchmarking/aws/cleanup-lambda && go mod tidy)
          git diff HEAD -- 'benchmarking/aws/go.*' 'benchmarking/aws/cleanup-lambda/go.*'
          git diff-index HEAD --exit-code -- 'benchmarking/aws/go.*' 'benchmarking/aws/cleanup-lambda/go.*'

      # -race because the code under test is genuinely concurrent (workload
      # goroutine, mid-run emit loop, mutex-guarded fakes). It needs cgo, so
      # these two steps override the job-level CGO_ENABLED=0 (which the lint
      # steps below still want).
      - name: Test benchmarking/aws
        working-directory: benchmarking/aws
        env:
          CGO_ENABLED: 1
        run: go test -race -timeout 8m -shuffle=on ./...

      - name: Test cleanup-lambda
        working-directory: benchmarking/aws/cleanup-lambda
        env:
          CGO_ENABLED: 1
        run: go test -race -timeout 8m -shuffle=on ./...

      - name: Set version env variables
        run: cat .versions >> $GITHUB_ENV

      - name: Lint benchmarking/aws
        uses: golangci/golangci-lint-action@v9
        with:
          version: "v${{env.GOLANGCI_LINT_VERSION}}"
          args: "--timeout=15m"
          working-directory: benchmarking/aws
          skip-cache: true
          skip-save-cache: true

      - name: Lint cleanup-lambda
        uses: golangci/golangci-lint-action@v9
        with:
          version: "v${{env.GOLANGCI_LINT_VERSION}}"
          args: "--timeout=15m"
          working-directory: benchmarking/aws/cleanup-lambda
          skip-cache: true
          skip-save-cache: true

  test-push-to-gcp-ar:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up test packages
        run: |
          touch /tmp/test.rpm
          touch /tmp/test.deb

      - name: Mock gcloud CLI
        run: |
          printf '#!/bin/bash\necho "gcloud $*"\n' \
            | sudo tee /usr/local/bin/gcloud > /dev/null
          sudo chmod +x /usr/local/bin/gcloud

      - name: Test RPM GA — routed to redpanda-yum
        run: |
          out=$(./resources/scripts/push_pkg_to_gcp_ar.sh /tmp/test.rpm 1.0.0)
          echo "$out"
          echo "$out" | grep -q "artifacts yum upload redpanda-yum"

      - name: Test RPM RC — routed to redpanda-unstable-yum
        run: |
          out=$(./resources/scripts/push_pkg_to_gcp_ar.sh /tmp/test.rpm 1.0.0-rc1)
          echo "$out"
          echo "$out" | grep -q "artifacts yum upload redpanda-unstable-yum"

      - name: Test DEB — routed to redpanda-apt
        run: |
          out=$(./resources/scripts/push_pkg_to_gcp_ar.sh /tmp/test.deb 1.0.0)
          echo "$out"
          echo "$out" | grep -q "artifacts apt upload redpanda-apt"
