name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        free_disk: [sync, none, background]
    env:
      CGO_ENABLED: 1
    steps:
      # DO NOT MERGE: disk measurement probe.
      - name: Disk probe (start)
        run: |
          df -h / /mnt || true
          docker system df
          echo "nproc=$(nproc)"
          nohup bash -c 'while true; do echo "$(date +%s) $(df -B1 --output=used,avail / | tail -1)" >> /tmp/disk-samples.txt; sleep 2; done' >/dev/null 2>&1 &

      - name: Size of target directories
        if: matrix.free_disk == 'none'
        run: |
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell; do
            s=$(date +%s.%N); sz=$(sudo du -sh "$d" 2>/dev/null | cut -f1); e=$(date +%s.%N)
            echo "du $d size=${sz:-absent} time=$(echo "$e - $s" | bc)s"
          done

      - name: Free disk space (sync, timed)
        if: matrix.free_disk == 'sync'
        run: |
          avail() { df -B1M --output=avail / | tail -1 | tr -d ' '; }
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell; do
            a=$(avail); s=$(date +%s.%N); sudo rm -rf "$d"; e=$(date +%s.%N); b=$(avail)
            echo "rm $d freed=$((b - a))MiB time=$(echo "$e - $s" | bc)s"
          done
          a=$(avail); s=$(date +%s.%N); sudo docker image prune --all --force | tail -1; e=$(date +%s.%N); b=$(avail)
          echo "docker image prune freed=$((b - a))MiB time=$(echo "$e - $s" | bc)s"
          df -h /

      - name: Free disk space (background)
        if: matrix.free_disk == 'background'
        run: |
          sudo nohup bash -c 'rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell; docker image prune --all --force; date +%s > /tmp/free-done' >/dev/null 2>&1 &
          date +%s > /tmp/free-start

      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libzmq3-dev

      - name: Install Task
        uses: ./.github/actions/setup-task

      - name: Deps
        run: task deps && git diff HEAD -- go.mod go.sum && git diff-index HEAD --exit-code

      - name: Docs
        run: CGO_ENABLED=1 TAGS=x_benthos_extra task docs && test -z "$(git ls-files --others --modified --exclude-standard)" || { >&2 echo "Stale docs detected. This can be fixed with 'task docs'."; exit 1; }

      - name: Test
        run: task test

      - name: Disk probe (end)
        if: always()
        run: |
          df -h / /mnt || true
          du -sh ~/.cache/go-build ~/go/pkg/mod || true
          if [ -f /tmp/free-done ]; then echo "background free took $(( $(cat /tmp/free-done) - $(cat /tmp/free-start) ))s"; fi
          echo "samples=$(wc -l < /tmp/disk-samples.txt)"
          echo "peak used (GiB) and min avail (GiB):"
          sort -k2 -n /tmp/disk-samples.txt | tail -1 | awk '{printf "used=%.2f avail=%.2f at=%s\n", $2/2^30, $3/2^30, $1}'

  golangci-lint:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Set version env variables
        run: cat .versions >> $GITHUB_ENV

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: "v${{env.GOLANGCI_LINT_VERSION}}"
          args: "--timeout=30m cmd/... internal/... public/..."
          skip-cache: true
          skip-save-cache: true

  test-benchmarking:
    # The benchmarking harness lives in standalone Go modules
    # (benchmarking/aws and benchmarking/aws/cleanup-lambda) so its AWS SDK
    # deps stay out of the published root module — which also makes it
    # invisible to the root `task test` / lint / tidy checks above. This job
    # is its gate: tests, tidy drift, and lint for both modules.
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'benchmarking/aws/go.mod'

      - name: Deps
        run: |
          (cd benchmarking/aws && go mod tidy)
          (cd benchmarking/aws/cleanup-lambda && go mod tidy)
          git diff HEAD -- 'benchmarking/aws/go.*' 'benchmarking/aws/cleanup-lambda/go.*'
          git diff-index HEAD --exit-code -- 'benchmarking/aws/go.*' 'benchmarking/aws/cleanup-lambda/go.*'

      # -race because the code under test is genuinely concurrent (workload
      # goroutine, mid-run emit loop, mutex-guarded fakes). It needs cgo, so
      # these two steps override the job-level CGO_ENABLED=0 (which the lint
      # steps below still want).
      - name: Test benchmarking/aws
        working-directory: benchmarking/aws
        env:
          CGO_ENABLED: 1
        run: go test -race -timeout 8m -shuffle=on ./...

      - name: Test cleanup-lambda
        working-directory: benchmarking/aws/cleanup-lambda
        env:
          CGO_ENABLED: 1
        run: go test -race -timeout 8m -shuffle=on ./...

      - name: Set version env variables
        run: cat .versions >> $GITHUB_ENV

      - name: Lint benchmarking/aws
        uses: golangci/golangci-lint-action@v9
        with:
          version: "v${{env.GOLANGCI_LINT_VERSION}}"
          args: "--timeout=15m"
          working-directory: benchmarking/aws
          skip-cache: true
          skip-save-cache: true

      - name: Lint cleanup-lambda
        uses: golangci/golangci-lint-action@v9
        with:
          version: "v${{env.GOLANGCI_LINT_VERSION}}"
          args: "--timeout=15m"
          working-directory: benchmarking/aws/cleanup-lambda
          skip-cache: true
          skip-save-cache: true

  test-push-to-gcp-ar:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up test packages
        run: |
          touch /tmp/test.rpm
          touch /tmp/test.deb

      - name: Mock gcloud CLI
        run: |
          printf '#!/bin/bash\necho "gcloud $*"\n' \
            | sudo tee /usr/local/bin/gcloud > /dev/null
          sudo chmod +x /usr/local/bin/gcloud

      - name: Test RPM GA — routed to redpanda-yum
        run: |
          out=$(./resources/scripts/push_pkg_to_gcp_ar.sh /tmp/test.rpm 1.0.0)
          echo "$out"
          echo "$out" | grep -q "artifacts yum upload redpanda-yum"

      - name: Test RPM RC — routed to redpanda-unstable-yum
        run: |
          out=$(./resources/scripts/push_pkg_to_gcp_ar.sh /tmp/test.rpm 1.0.0-rc1)
          echo "$out"
          echo "$out" | grep -q "artifacts yum upload redpanda-unstable-yum"

      - name: Test DEB — routed to redpanda-apt
        run: |
          out=$(./resources/scripts/push_pkg_to_gcp_ar.sh /tmp/test.deb 1.0.0)
          echo "$out"
          echo "$out" | grep -q "artifacts apt upload redpanda-apt"
