name: Integration Tests

# Superseded pull request runs used a relatively large part of the 32-core runner time. Thus, a new push to a pull
# request cancels the run of the previous push. Other events use the run ID as the key, so they are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  schedule:
    # Run every day at 1AM UTC
    - cron: '0 1 * * *'
  pull_request:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      filter:
        description: 'Package filter (e.g. aws kafka). Leave empty to run all.'
        required: false
        default: ''
        type: string

jobs:
  integration-test:
    if: ${{ github.event_name != 'issue_comment' && github.event.inputs.filter == '' && (github.event_name != 'pull_request' || startsWith(github.event.pull_request.title, 'build(deps)')) }}
    runs-on: ubuntu-latest-32
    env:
      CGO_ENABLED: 0
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Install Task
        uses: ./.github/actions/setup-task

      # Fetch all modules up front so a Go proxy error fails here, not inside a random test package.
      - name: Download Go modules
        run: go mod download

      - name: Pull Latest Redpanda Image
        run: task docker:pull-redpanda

      - name: Run Integration Tests
        run: task test:integration -- --output-dir "${{ runner.temp }}/integration"
        timeout-minutes: 120

      - name: Write Summary
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/integration/index.md" ]; then
            cat "${{ runner.temp }}/integration/index.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Test Output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-output
          path: ${{ runner.temp }}/integration/
          retention-days: 7

  check-author-access:
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.perm.outputs.allowed }}
    steps:
      - name: Check author permission
        id: perm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PERMISSION=$(gh api "repos/${{ github.repository }}/collaborators/${{ github.event.pull_request.user.login }}/permission" --jq '.permission' 2>/dev/null || echo "none")
          if [[ "${PERMISSION}" == "admin" || "${PERMISSION}" == "write" ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi

  integration-test-filter:
    needs: [check-author-access]
    if: >-
      always() && (
        needs.check-author-access.outputs.allowed == 'true' ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/integration ')) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.filter != '') ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-integration-tests'))
      )
    runs-on: ubuntu-latest-32
    env:
      CGO_ENABLED: 0
    # Read by notify-rpcn-bot. The outcome comes from the runner, not from
    # anything the tested code can write. The filter can come from a PR comment
    # or a step that runs PR code, so treat it as untrusted text.
    outputs:
      integration_outcome: ${{ steps.integration.outcome }}
      filter: ${{ steps.parse.outputs.filter || steps.detect.outputs.filters || github.event.inputs.filter }}
    steps:
      - name: Check commenter permissions
        if: ${{ github.event_name == 'issue_comment' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PERMISSION=$(gh api "repos/${{ github.repository }}/collaborators/${{ github.event.comment.user.login }}/permission" --jq '.permission')
          if [[ "${PERMISSION}" != "admin" && "${PERMISSION}" != "write" ]]; then
            echo "::error::User ${{ github.event.comment.user.login }} does not have write access"
            exit 1
          fi

      - name: Parse filter from comment
        if: ${{ github.event_name == 'issue_comment' }}
        id: parse
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          FILTER=$(echo "${COMMENT_BODY}" | sed 's|^/integration ||')
          echo "filter=${FILTER}" >> "$GITHUB_OUTPUT"

      - name: Checkout PR branch
        if: ${{ github.event_name == 'issue_comment' }}
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.issue.number }}/merge

      - name: Checkout code
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout code
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          # A PR command (/integration) runs this job on the main branch, but with PR code.
          # A cache save from that run can poison the main cache. Thus, do not cache for a PR command.
          cache: ${{ github.event_name != 'issue_comment' }}

      - name: Install Task
        uses: ./.github/actions/setup-task

      # Fetch all modules up front so a Go proxy error fails here, not inside a random test package.
      - name: Download Go modules
        run: go mod download

      - name: Verify Integration Tests Registry
        run: task test:integration:verify

      # The filter is every package in packages.json whose test binary
      # (go list -test -deps) includes a package this PR changes, so a change
      # to shared code such as internal/license runs the components that use
      # it. A _test.go or testdata/ change only runs its own package. Over the
      # package budget, filters is empty and budget_exceeded is true.
      - name: Detect changed packages
        if: ${{ github.event_name == 'pull_request' }}
        id: detect
        run: |
          CHANGED=$(git diff --name-only "$(git merge-base HEAD origin/${{ github.base_ref }})"...HEAD)
          printf '%s\n' "${CHANGED}" | go run ./cmd/tools/integration affected >> "$GITHUB_OUTPUT"
          if printf '%s\n' "${CHANGED}" | grep -qxE 'go\.(mod|sum)'; then
            echo "go_mod=true" >> "$GITHUB_OUTPUT"
          else
            echo "go_mod=false" >> "$GITHUB_OUTPUT"
          fi

      # On a pull request the filter comes from the detect step. An empty
      # filter means every package in packages.json, which does not fit the
      # 30-minute budget, so a pull request never runs it:
      # - No package depends on the change and go.mod and go.sum are
      #   unchanged: skip and say so in the summary (workflow, docs and
      #   tooling changes).
      # - go.mod or go.sum changed, or the change reaches more packages than
      #   the budget allows: fail and ask for /integration <packages>, so the
      #   change does not pass without any integration run. The /integration
      #   run reports on main, not on this PR, so this check stays red; a
      #   maintainer merges once that run passes.
      # The run-integration-tests label is not checked: auto-label-integration
      # adds it to every pull request from a write-access author.
      # A comment or a dispatch passes its own filter through unchanged. A bare
      # "/integration " or an empty dispatch filter still means every package.
      - name: Pull Latest Redpanda Image
        if: ${{ github.event_name != 'pull_request' || steps.detect.outputs.filters != '' }}
        run: task docker:pull-redpanda

      # A pull request that touches nothing under internal/impl/ has no packages to
      # test; without this guard the empty filter runs every package and the step
      # times out.
      - name: Run Integration Tests
        id: integration
        if: ${{ github.event_name != 'pull_request' || steps.detect.outputs.filters != '' }}
        env:
          FILTER: ${{ steps.parse.outputs.filter || steps.detect.outputs.filters || github.event.inputs.filter }}
        run: task test:integration -- --output-dir "${{ runner.temp }}/integration" ${FILTER}
        timeout-minutes: 30

      - name: No integration test depends on the change
        if: ${{ github.event_name == 'pull_request' && steps.detect.outputs.filters == '' && steps.detect.outputs.go_mod != 'true' && steps.detect.outputs.budget_exceeded != 'true' }}
        run: echo "No integration test package depends on the files this pull request changes; the filtered integration run was skipped." >> "$GITHUB_STEP_SUMMARY"

      - name: Require a package filter
        if: ${{ github.event_name == 'pull_request' && steps.detect.outputs.filters == '' && (steps.detect.outputs.go_mod == 'true' || steps.detect.outputs.budget_exceeded == 'true') }}
        env:
          AFFECTED: ${{ steps.detect.outputs.affected }}
          BUDGET_EXCEEDED: ${{ steps.detect.outputs.budget_exceeded }}
        run: |
          if [[ "${BUDGET_EXCEEDED}" == "true" ]]; then
            REASON="The tests of these packages depend on the files this pull request changes, which is more than this job's 30-minute budget can run: ${AFFECTED}."
          else
            REASON="go.mod or go.sum changed and no integration test package depends on the other files this pull request changes, and the full suite does not fit this job's 30-minute budget."
          fi
          MSG="${REASON} Comment /integration <packages> on this PR (for example /integration kafka aws) to run the packages this change affects. That run reports on main, not on this PR, so this check stays red; a maintainer can merge once the /integration run passes."
          echo "::error title=Integration filter required::${MSG}"
          echo "${MSG}" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Write Summary
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/integration/index.md" ]; then
            cat "${{ runner.temp }}/integration/index.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Test Output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-output
          path: ${{ runner.temp }}/integration/
          retention-days: 7

  # Tells rpcn-bot (internal-agents repo, agents/rpcn-bot) that a filtered run
  # passed; the bot posts a summary in #team-redpanda-connect. Trial on this
  # job first; the nightly integration-test job gets the same later.
  #
  # A separate job, never a step in integration-test-filter: on issue_comment
  # that job checks out and runs the PR's code (including fork PRs) with the
  # base repo's secrets available, and anything it runs can rewrite
  # $GITHUB_PATH, $GITHUB_ENV or files on disk before a later step. This job
  # gets a fresh runner, checks out nothing, and is the only place the
  # rpcn-bot secrets appear.
  #
  # integration_outcome, not the job result: the test step is skipped on a
  # pull request that no package depends on, and that must not report as a
  # pass. Skips when the secrets or URL are absent; a failed notification
  # only warns.
  notify-rpcn-bot:
    needs: [integration-test-filter]
    if: ${{ always() && needs.integration-test-filter.outputs.integration_outcome == 'success' }}
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Notify rpcn-bot
        env:
          RPCN_BOT_CLIENT_ID: ${{ secrets.RPCN_BOT_CLIENT_ID }}
          RPCN_BOT_CLIENT_SECRET: ${{ secrets.RPCN_BOT_CLIENT_SECRET }}
          RPCN_BOT_URL: ${{ vars.RPCN_BOT_GATEWAY_URL }}
          FILTER: ${{ needs.integration-test-filter.outputs.filter }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$RPCN_BOT_CLIENT_ID" ] || [ -z "$RPCN_BOT_URL" ]; then
            echo "rpcn-bot secrets or RPCN_BOT_GATEWAY_URL not set; skipping notification"
            exit 0
          fi
          # Bodies are built with jq --arg: the filter is untrusted text and
          # must not be able to break or extend the JSON.
          TOKEN=$(jq -n --arg id "$RPCN_BOT_CLIENT_ID" --arg secret "$RPCN_BOT_CLIENT_SECRET" \
              '{client_id: $id, client_secret: $secret, audience: "cloudv2-production.redpanda.cloud", grant_type: "client_credentials"}' \
            | curl -sf https://auth.prd.cloud.redpanda.com/oauth/token -H 'Content-Type: application/json' -d @- \
            | jq -r .access_token) || TOKEN=""
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::warning::rpcn-bot notification skipped: could not get a Redpanda Cloud token"
            exit 0
          fi

          TEXT="Integration tests passed (${GITHUB_EVENT_NAME}) for packages: ${FILTER:-all}."
          if [ -n "$PR_NUMBER" ]; then
            TEXT="$TEXT PR: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${PR_NUMBER}."
          fi
          TEXT="$TEXT Run: ${RUN_URL}. Post a one-line summary for the team."

          # C076AV2M5MH = #team-redpanda-connect
          jq -n --arg text "$TEXT" '{text: $text, channel: "C076AV2M5MH", source: "github-actions/integration-tests"}' \
            | curl -sf -X POST "$RPCN_BOT_URL" \
                -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d @- \
            || echo "::warning::rpcn-bot notification failed"
