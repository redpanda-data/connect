http:
  debug_endpoints: true

# Same as benchmark_config_toxiproxy.yaml, but points at the oracledb-scnbump
# container (via the 'oracle-scnbump' toxiproxy proxy, task
# toxiproxy:scnbump:up in connect_contrib_3's bench dir - port 14522 ->
# 1522) instead of the regular oracledb container. Reset the checkpoint back
# to the pre-gap baseline first with `task scnbump:reset-checkpoint`.
#
# scn_window variant, for an A/B against benchmark_config_scnbump.yaml (the
# log_count variant). scn_window_size/max_scn_window_size are set to match a
# real customer's production configuration, to measure what a switch to
# log_count would actually improve for their workload - not a synthetic
# defaults-vs-defaults comparison. Everything else (connection, tables,
# backoff/mining intervals, batching) is identical between the two files.
input:
  oracledb_cdc:
    connection_string: oracle://c%23%23testdb:testdb123@localhost:14522/FREE
    pdb_name: TESTPDB
    snapshot_mode: none
    snapshot_max_batch_size: 5000
    logminer:
      window_strategy: scn_window
      scn_window_size: 10000
      max_scn_window_size: 200000
      backoff_interval: 10s
      mining_interval: 100ms
      strategy: "online_catalog"
      lob_enabled: true
    include:
      - TESTDB.USERS
      - TESTDB.PRODUCTS
      - TESTDB.CART
    batching:
      period: 1s

output:
  # processors:
  #   - benchmark:
  #       interval: 1s
  #       count_bytes: true
  # file:
  #   path: "./benchmark_results.json"
  #   codec: lines
  stdout: {}

logger:
  level: DEBUG

metrics:
  prometheus:
    add_process_metrics: true
    add_go_metrics: true
