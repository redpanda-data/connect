version: '3'

# Running order - Preferred (CDB mode, connect via CDB root):
# - task bench:up                                   # start Oracle, enable archive logging, create TESTPDB and users
# - task sqlcl:pdb:data:users [TOTAL=1000000]       # load data (also gathers optimizer statistics)
# - task sqlcl:pdb:data:products [TOTAL=50000]      # optional
# - task sqlcl:pdb:data:cart [TOTAL=10000000]       # optional
# - task bench:run
# - task bench:reset                                # drop the checkpoint cache and results before the next run
# - task bench:down

# Running order (PDB mode, connect via PDB service):
# As above, but point benchmark_config.yaml at the TESTPDB service (the CDB users that
# bench:up creates are simply unused), and also run sqlcl:pdb:drop-cache before the next run,
# since bench:reset only drops the CDB checkpoint cache.

# CONTAINER and PORT select the Oracle container and the host port it listens on, so
# several datasets can live side by side, e.g. task bench:up CONTAINER=oracledb-big PORT=1533.
# benchmark_config.yaml connects to localhost:1521; point it at PORT when it differs.
vars:
  CONTAINER: '{{.CONTAINER | default "oracledb"}}'
  PORT: '{{.PORT | default "1521"}}'

tasks:

  bench:up:
    desc: Full CDB setup (preferred multi-PDB mode)
    cmds:
      - docker run -d
          --name {{.CONTAINER}}
          -p {{.PORT}}:1521
          -e ORACLE_PWD=YourPassword123
          container-registry.oracle.com/database/free:latest-lite
      - cmd: echo "Waiting for OracleDB..." && sleep 10
      - task: oracledb:archivelog
      - cmd: echo "Configuring archive log" && sleep 5
      - task: pdb:create
      - task: pdb:setup
      - task: cdb:setup

  bench:down:
    desc: Teardown benchmark
    cmd: docker rm -fv {{.CONTAINER}}

  bench:reset:
    desc: Clear benchmark in preparation for a new run
    cmds:
      - task: sqlcl:cdb:drop-cache
      - cmd: rm -f ./benchmark_results.json
      - cmd: rm -f ./benchmark_logs.log

  bench:run:
    desc: Run benchmark
    cmds:
      - task: connect:run

  # ── Data setup ───────────────────────────────────────────────────────────────

  oracledb:logs:
    cmd: docker logs -f {{.CONTAINER}}

  oracledb:archivelog:
    desc: Enable ARCHIVELOG mode (required for LogMiner/CDC). Must be run after oracledb:up.
    cmds:
      - docker exec {{.CONTAINER}} mkdir -p /opt/oracle/oradata/recovery_area
      - docker exec -i {{.CONTAINER}} sqlplus / as sysdba < archivelog_enable.sql
      - docker exec {{.CONTAINER}} lsnrctl start || true
      - task: rman:setup

  rman:setup:
    desc: Configure archive log retention for local CDC development (keeps logs available for LogMiner)
    cmd: docker exec -i {{.CONTAINER}} sqlplus -s / as sysdba < retention_setup.sql

  sqlcl:create:
    cmd: docker exec -i {{.CONTAINER}} sqlplus -s system/YourPassword123@FREE < create.sql

  cdb:setup:
    desc: Create C##TESTDB and C##RPCN common users for CDB-mode connector testing
    cmd: docker exec -i {{.CONTAINER}} sqlplus -s / as sysdba < cdb_setup.sql

  pdb:create:
    desc: Create and open the TESTPDB pluggable database (requires Docker, runs as SYSDBA)
    cmd: docker exec -i {{.CONTAINER}} sqlplus -s / as sysdba < pdb_create.sql

  pdb:setup:
    desc: Create users, enable supplemental logging, and create tables in TESTPDB
    cmd: docker exec -i {{.CONTAINER}} sqlplus -s pdbadmin/pdbadmin123@localhost:1521/TESTPDB < pluggable.sql

  sqlcl:pdb:data:users:
    desc: Insert test users data into TESTPDB (default 1000000 rows, override with TOTAL=...)
    vars:
      TOTAL: '{{.TOTAL | default "1000000"}}'
    cmd: (echo "DEFINE users_total = {{.TOTAL}}"; cat users.sql) | docker exec -i {{.CONTAINER}} sqlplus -s testdb/testdb123@localhost:1521/TESTPDB

  sqlcl:pdb:data:products:
    desc: Insert test products data into TESTPDB (default 50000 rows, override with TOTAL=...)
    vars:
      TOTAL: '{{.TOTAL | default "50000"}}'
    cmd: (echo "DEFINE products_total = {{.TOTAL}}"; cat products.sql) | docker exec -i {{.CONTAINER}} sqlplus -s testdb/testdb123@localhost:1521/TESTPDB

  sqlcl:pdb:data:cart:
    desc: Insert test cart data into TESTPDB (default 10000000 rows, override with TOTAL=...)
    vars:
      TOTAL: '{{.TOTAL | default "10000000"}}'
    cmd: (echo "DEFINE cart_total = {{.TOTAL}}"; cat cart.sql) | docker exec -i {{.CONTAINER}} sqlplus -s testdb/testdb123@localhost:1521/TESTPDB

  sqlcl:pdb:drop-cache:
    desc: Drop the CDC checkpoint cache table from TESTPDB (PDB mode, connect via PDB service)
    cmd: docker exec -i {{.CONTAINER}} sqlplus -s rpcn/rpcn123@localhost:1521/TESTPDB <<< "DROP TABLE IF EXISTS RPCN.CDC_CHECKPOINT_CACHE;"

  sqlcl:cdb:drop-cache:
    desc: Drop the CDC checkpoint cache table from CDB root (CDB mode, connect via CDB root)
    cmd: docker exec -i {{.CONTAINER}} sqlplus -s / as sysdba <<< "DROP TABLE IF EXISTS C##RPCN.CDC_CHECKPOINT_TESTPDB;"

  connect:run:
    desc: Run Connect using the benchmark_config.yaml configuration
    cmd: go run ../../../../cmd/redpanda-connect/main.go run ./benchmark_config.yaml 2>&1 | tee benchmark_logs.log

  # ── Debezium Setup ───────────────────────────────────────────────────────────────

  debezium:up:
    desc: Start Debezium Server and Kafka
    cmd: docker-compose -f docker-compose.debezium.yaml up -d

  debezium:down:
    desc: Stop and remove Debezium Server and Kafka (wipes volumes)
    cmd: docker-compose -f docker-compose.debezium.yaml down -v

  debezium:logs:
    desc: Tail Debezium Server logs
    cmd: docker logs -f debezium-server

  debezium:kafka:offsets:
    desc: Watch msgs/s on a Kafka topic (default oracle-cdc.TESTDB.USERS, override with TOPIC=...)
    cmd: bash kafka-offsets.sh {{.TOPIC | default "oracle-cdc.TESTDB.USERS"}}

  connect:kafka:offsets:
    desc: Watch msgs/s on a Kafka topic (default connect-cdc.TESTDB.USERS, override with TOPIC=...)
    cmd: bash kafka-offsets.sh {{.TOPIC | default "oracle-cdc.TESTDB.USERS"}}
