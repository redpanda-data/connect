version: "3"

vars:
  PG_DSN: '{{.PG_DSN | default "postgres://postgres:postgres@localhost:5433/testdb?sslmode=disable"}}'

tasks:
  # ── Infrastructure ────────────────────────────────────────────────────────────

  up:
    desc: Start PostgreSQL and run schema/data setup
    cmds:
      - docker compose up -d postgres
      - docker compose run --rm setup

  down:
    desc: Stop and remove all containers and volumes
    cmds:
      - docker compose down -v

  reset:
    desc: Full teardown + bring back up (also drops and recreates the replication slot)
    cmds:
      - task: down
      - task: up

  # ── Slot management ───────────────────────────────────────────────────────────

  slot:drop:
    desc: Drop the replication slot so the test can be re-run from scratch
    cmds:
      - |
        psql "{{.PG_DSN}}" -c \
          "SELECT pg_drop_replication_slot('multi_schema_test_slot')
           FROM pg_replication_slots
           WHERE slot_name = 'multi_schema_test_slot';"

  # ── Run the pipeline ──────────────────────────────────────────────────────────

  run:
    desc: Run the multi-schema CDC pipeline (streams snapshot then live CDC)
    env:
      PG_DSN: '{{.PG_DSN}}'
    cmds:
      - task: slot:drop
      - go run ../../../../../cmd/redpanda-connect/main.go run ./test_config.yaml

  # ── Test data ─────────────────────────────────────────────────────────────────

  data:insert:
    desc: Insert CDC rows into all three tenant schemas (tenant_c must not appear in the output — it's excluded)
    cmds:
      - psql "{{.PG_DSN}}" -c "INSERT INTO tenant_a.events (name) VALUES ('dave'), ('eve');"
      - psql "{{.PG_DSN}}" -c "INSERT INTO tenant_b.events (name) VALUES ('frank');"
      - psql "{{.PG_DSN}}" -c "INSERT INTO tenant_c.events (name) VALUES ('trudy');"

  data:update:
    desc: Update a row in tenant_a (triggers update event with 'before' field)
    cmds:
      - psql "{{.PG_DSN}}" -c "UPDATE tenant_a.events SET status = 'updated' WHERE name = 'dave';"

  data:delete:
    desc: Delete a row from tenant_b (triggers delete event with 'before' field)
    cmds:
      - psql "{{.PG_DSN}}" -c "DELETE FROM tenant_b.events WHERE name = 'frank';"

  data:all:
    desc: Run all test data mutations in sequence (insert → update → delete)
    cmds:
      - task: data:insert
      - task: data:update
      - task: data:delete

  # ── Schema validation smoke test ──────────────────────────────────────────────

  test:invalid-schema:
    desc: Confirm that a malformed schema_pattern is rejected at startup, before any DB connection is attempted
    env:
      PG_DSN: '{{.PG_DSN}}'
    cmds:
      - |
        set +e
        go run ../../../../../cmd/redpanda-connect/main.go run \
          --set 'input.postgres_cdc.schema_pattern=1abc' \
          ./test_config.yaml 2>&1 | head -5
        echo "exit $?"
    # Expects: "invalid schema_pattern" error printed, process exits non-zero.
    # schema_pattern is validated eagerly in newPgStreamInput
    # (validateSchemaPattern), unlike schema which is only checked later,
    # against the live DB connection, inside NewPgStream.
    # Note: an empty schema_pattern is NOT an error - it means "unset", and
    # the connector falls back to the schema field (default "public").

  test:exclude-schemas-requires-pattern:
    desc: Confirm exclude_schemas is rejected at startup when schema_pattern is left unset
    env:
      PG_DSN: '{{.PG_DSN}}'
    cmds:
      - |
        set +e
        go run ../../../../../cmd/redpanda-connect/main.go run \
          ./test_config_exclude_no_pattern.yaml 2>&1 | head -5
        echo "exit $?"
    # Expects: "exclude_schemas requires schema_pattern to be set" error
    # printed, process exits non-zero. Uses a dedicated fixture file rather
    # than --set on test_config.yaml, since --set rejects an empty RHS
    # ("foo=" -> "expected foo=bar syntax"), so schema_pattern can't be
    # cleared that way.

  # ── Quick sanity ──────────────────────────────────────────────────────────────

  psql:
    desc: Open a psql shell to the test database
    cmds:
      - psql "{{.PG_DSN}}"

  status:
    desc: Show active replication slots and publications
    cmds:
      - psql "{{.PG_DSN}}" -c "SELECT slot_name, active FROM pg_replication_slots;"
      - psql "{{.PG_DSN}}" -c "SELECT pubname FROM pg_publication;"
