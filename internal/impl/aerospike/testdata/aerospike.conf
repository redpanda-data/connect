service {
    proto-fd-max 15000
    # Mandatory from Database 7.0.0 onwards.
    cluster-name redpanda-demo
}

logging {
    console {
        context any info
    }
}

network {
    service {
        address any
        port 3000
    }
    heartbeat {
        mode mesh
        port 3002
    }
    fabric {
        port 3001
    }
}

namespace test {
    replication-factor 1
    default-ttl 0

    # NSUP is disabled by default (nsup-period 0), which means TTLs are never
    # reaped and any write carrying a positive TTL is rejected with error 22.
    # Anything cache-shaped needs this set.
    nsup-period 10

    storage-engine memory {
        data-size 1G
    }
}

# nsup-period 0 rejects a positive TTL with result code 22 (FAIL_FORBIDDEN).
# 0, -1, and -2 are still accepted. TestIntegrationFallbackDLQ uses this
# namespace for a pipeline that acknowledges 22 and publishes other rejects.
namespace nosup {
    replication-factor 1
    default-ttl 0
    nsup-period 0

    storage-engine memory {
        data-size 1G
    }
}
