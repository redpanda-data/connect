# Container as-ee-1. Host tests use 127.0.0.1:3100 (Docker Desktop).
service {
    proto-fd-max 15000
    cluster-name aero-integ-redpanda-ee
    feature-key-file /opt/rpcn/features.conf
    # Stable across container recreate. The sc roster names these ids.
    node-id BB917465FFBF3E6
}

logging {
    console {
        context any info
    }
}

network {
    service {
        address any
        port 3000
        access-address 127.0.0.1
        access-port 3100
        alternate-access-address as-ee-1
        alternate-access-port 3000
    }
    heartbeat {
        mode mesh
        address any
        port 3002
        mesh-seed-address-port as-ee-1 3002
        mesh-seed-address-port as-ee-2 3002
    }
    fabric {
        port 3001
    }
}

namespace test {
    replication-factor 2
    default-ttl 0
    nsup-period 10
    storage-engine memory {
        data-size 1G
    }
}

namespace sc {
    replication-factor 2
    strong-consistency true
    default-ttl 0
    nsup-period 10
    storage-engine memory {
        data-size 1G
    }
}
