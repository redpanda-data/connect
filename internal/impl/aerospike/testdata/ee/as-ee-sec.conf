# Container as-ee-sec: access control + TLS. Separate cluster from as-ee-1/2.
# Plaintext+auth: 127.0.0.1:3200  TLS: 127.0.0.1:clusterA:4333
service {
    proto-fd-max 15000
    cluster-name aero-integ-redpanda-ee-sec
    feature-key-file /opt/rpcn/features.conf
}

logging {
    console {
        context any info
    }
}

network {
    service {
        address any
        port 3000
        access-address 127.0.0.1
        access-port 3200
        alternate-access-address as-ee-sec
        alternate-access-port 3000
        tls-address any
        tls-port 4333
        tls-access-address 127.0.0.1
        tls-access-port 4333
        tls-name clusterA
        # any: the TLS listener requires a client certificate signed by ca-file.
        # Password login still sends credentials; PKI login uses the certificate CN.
        tls-authenticate-client any
    }
    heartbeat {
        mode mesh
        port 3002
    }
    fabric {
        port 3001
    }
    tls clusterA {
        cert-file /opt/rpcn/certs/server.pem
        key-file /opt/rpcn/certs/server.key
        ca-file /opt/rpcn/certs/ca.pem
    }
}

security {
}

namespace test {
    replication-factor 1
    default-ttl 0
    nsup-period 10
    storage-engine memory {
        data-size 1G
    }
}
