name: oracle-orders-5table-readers
description: |
  FOLLOW-UP TO oracle/orders-5table-split — does adding READERS raise aggregate
  throughput, and what does it cost the database?

  orders-5table-split established that the oracledb_cdc ceiling is per-reader,
  not per-database: one input mining 1 of 5 loaded tables captured 98% of its
  table (and went idle 2.7% of samples) while one input mining all 5 captured
  only 55% and never idled. It could not answer the next question, because only
  ONE reader was ever active: every reader runs its own independent LogMiner
  mining pass over the whole redo stream, so N readers may cost the DATABASE up
  to N times the mining work even though each reader only parses its own rows.

  This scenario sweeps reader COUNT at fixed load: the same 5 tables written at
  ~7 MB/s each (~35 MB/s total) in every arm, with the 5 tables distributed over
  1, then 2, then 5 concurrent `oracledb_cdc` inputs inside a `broker` input
  (benthos `broker` reads its inputs in parallel, so this is genuinely N
  concurrent LogMiner sessions in one process). Each reader gets its OWN
  checkpoint_cache_key — they share one memory cache resource, and the default
  key would make them clobber each other's SCN.

  Reading the result — aggregate captured throughput:
    r1 ~19-21, r2 ~35, r5 ~35  -> readers scale, 5 x 7 MB/s is achievable.
    r1 ~19-21, r2 ~30, r5 ~30  -> partial scaling; a plateau to characterise.
    r1 ~ r2 ~ r5 ~ 19-21       -> the ceiling is shared after all, and the
                                  split-test result does NOT generalise to
                                  concurrent readers.

  AND THE MEASUREMENT THIS SCENARIO EXISTS FOR — Oracle's own CPU. The harness
  does not scrape source-database metrics, so collect it post-run from
  CloudWatch per arm window (the RDS identifier `rpcn-bench-ora-ora` is stable
  and metrics outlive teardown):
    CPU flat across r1/r2/r5   -> Oracle pushes the table filter down and skips
                                  non-matching redo cheaply; many readers are
                                  affordable.
    CPU scaling ~linearly      -> each reader really does re-mine the whole
                                  stream; readers per database are tightly
                                  capped and the ~24-tables-per-DB plan needs
                                  few, larger readers.

  Load is held IDENTICAL across arms so aggregate capture % is comparable, and
  cores stay at 4 vCPU / GOMAXPROCS 8 (as in orders-5table-split) so a change
  cannot be a CPU artifact — measured per-reader cost there was only ~0.26
  cores, so 5 readers should need ~1.3.

connector: oracledb_cdc
stack: oracle

infra:
  source:
    # Identical to orders-5table-split so the r1 arm is directly comparable to
    # that run's b-5tables arm (which captured 55% at 19 MB/s median).
    instance_class: db.r5.2xlarge
    storage_gb: 800
    iops: 24000
  runner:
    instance_type: c8g.4xlarge

dataset:
  initial_rows: 0
  row_size_bytes: 1200
  tables: [orders_t1, orders_t2, orders_t3, orders_t4, orders_t5]
  seeder: cdc-rows-oracle

workload:
  # TOTAL rows/sec across tables for this seeder (it divides evenly and gives
  # each table its own workers). 30580 = 5 x 6116 rows/sec; 6116 x 1200B =
  # 7.0 MB/s per table, ~35 MB/s total. Same as orders-5table-split.
  write_rate_per_sec: 30580
  duration: 15m
  warmup: 2m

pipeline:
  cache_resources:
    - label: bench_checkpoint
      memory: {}
  input:
    # Base = the 5-reader shape. Every arm declares its own `broker.inputs`
    # list explicitly: mergePipeline replaces sequences wholesale and only
    # recurses into maps, so an arm's list fully replaces this one and the
    # `broker` key stays the only input key (two sibling input keys would be
    # an invalid config).
    broker:
      inputs:
        - oracledb_cdc: &reader_defaults
            connection_string: ${ORACLE_DSN}
            include: ["BENCH.ORDERS_T1"]
            stream_snapshot: true
            checkpoint_cache: bench_checkpoint
            checkpoint_cache_key: oracle_reader_1
            batching:
              count: 5000
              period: 1s
        - oracledb_cdc:
            <<: *reader_defaults
            include: ["BENCH.ORDERS_T2"]
            checkpoint_cache_key: oracle_reader_2
        - oracledb_cdc:
            <<: *reader_defaults
            include: ["BENCH.ORDERS_T3"]
            checkpoint_cache_key: oracle_reader_3
        - oracledb_cdc:
            <<: *reader_defaults
            include: ["BENCH.ORDERS_T4"]
            checkpoint_cache_key: oracle_reader_4
        - oracledb_cdc:
            <<: *reader_defaults
            include: ["BENCH.ORDERS_T5"]
            checkpoint_cache_key: oracle_reader_5

matrix:
  cpu_points: [4]
  arms:
    # r1 — one reader for all five tables. Reproduces orders-5table-split's
    # b-5tables arm through the broker wrapper, which both re-validates that
    # result and gives this sweep its own in-run baseline.
    - id: r1-one-reader
      gomaxprocs: 8
      streams: 1
      pipeline:
        input:
          broker:
            inputs:
              - oracledb_cdc:
                  connection_string: ${ORACLE_DSN}
                  include:
                    - "BENCH.ORDERS_T1"
                    - "BENCH.ORDERS_T2"
                    - "BENCH.ORDERS_T3"
                    - "BENCH.ORDERS_T4"
                    - "BENCH.ORDERS_T5"
                  stream_snapshot: true
                  checkpoint_cache: bench_checkpoint
                  checkpoint_cache_key: oracle_reader_all
                  batching:
                    count: 5000
                    period: 1s

    # r2 — two readers, 3 tables + 2 tables. The midpoint that turns a
    # two-point comparison into a shape: linear, plateauing, or flat.
    - id: r2-two-readers
      gomaxprocs: 8
      streams: 1
      pipeline:
        input:
          broker:
            inputs:
              - oracledb_cdc:
                  connection_string: ${ORACLE_DSN}
                  include:
                    - "BENCH.ORDERS_T1"
                    - "BENCH.ORDERS_T2"
                    - "BENCH.ORDERS_T3"
                  stream_snapshot: true
                  checkpoint_cache: bench_checkpoint
                  checkpoint_cache_key: oracle_reader_a
                  batching:
                    count: 5000
                    period: 1s
              - oracledb_cdc:
                  connection_string: ${ORACLE_DSN}
                  include:
                    - "BENCH.ORDERS_T4"
                    - "BENCH.ORDERS_T5"
                  stream_snapshot: true
                  checkpoint_cache: bench_checkpoint
                  checkpoint_cache_key: oracle_reader_b
                  batching:
                    count: 5000
                    period: 1s

    # r5 — five readers, one table each: the shape actually proposed to the
    # customer. Inherits the base broker block above.
    - id: r5-five-readers
      gomaxprocs: 8
      streams: 1

reset:
  # LogMiner is slotless and per-table supplemental logging survives TRUNCATE,
  # so reset is just the truncates. Oracle has no psql/mysql-style CLI on the
  # runner, so these go through the seeder's `exec` subcommand (go-ora).
  #
  # Reset runs on the RUNNER host, but the seeder is only staged at /opt/bench/
  # on the LOAD-GEN host during seeding — so self-stage it from the same S3 key
  # the seed phase uploaded to. The binary is arm64 and the runner is Graviton.
  - bash: |
      aws s3 cp s3://${RESULTS_BUCKET}/stage/cdc-rows-oracle /opt/bench/cdc-rows-oracle
      chmod +x /opt/bench/cdc-rows-oracle
      for t in ORDERS_T1 ORDERS_T2 ORDERS_T3 ORDERS_T4 ORDERS_T5; do
        /opt/bench/cdc-rows-oracle exec --dsn "${ORACLE_DSN}" --sql "TRUNCATE TABLE BENCH.$t"
      done
