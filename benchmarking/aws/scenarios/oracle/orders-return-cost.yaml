name: oracle-orders-return-cost
description: |
  FINAL DECOMPOSITION — the clean cost of RETURNING matched rows, measured
  between two readers that both keep up with the stream.

  orders-5table-baseline produced W=34.4%, M=46.4% (a reader mining everything,
  returning no DML) and R1=42.2% (a reader over all 5 tables). R1 - M came out
  NEGATIVE (-4.3 points), which is not a negative cost: r1 captured only ~54% of
  the load, so in a fixed window it advanced through roughly half as much redo as
  m1 did and therefore performed LESS mining. The two arms did not mine the same
  amount of stream, so the subtraction was invalid.

  This run fixes that by keeping every reader arm UNDER the ~19 MB/s
  single-reader ceiling, so all of them keep pace with the stream and mining
  coverage is identical by construction:

    w0-writes-only   no Oracle reader. Oracle CPU = write path (control).
    m0-zero-tables   one reader on BENCH.ORDERS_IDLE (never written). Mines the
                     whole stream, returns no DML. NOTE it still receives
                     transaction-control rows (START/COMMIT/ROLLBACK are matched
                     unfiltered, because transaction boundaries are needed
                     regardless of table), so this is "scan + txn bookkeeping",
                     not "scan alone".
    a2-two-tables    one reader on ORDERS_T1 + ORDERS_T2 = 14.0 MB/s returned,
                     comfortably under the ~19 MB/s ceiling so it keeps up.

  The measurement:
    A2 - M0  = cost to Oracle of reconstructing and shipping 14 MB/s of matched
               rows, with mining held constant. THIS is the number that was
               previously unobtainable.
    M0 - W   = the per-reader scan + txn-bookkeeping toll (re-measured in-run;
               was 12.0 points).

  VALIDITY GATE: a2 must capture ~100% of its two tables (~12,232 rows/s). If it
  captures materially less it fell behind, mining coverage diverged again, and
  A2 - M0 is invalid exactly as R1 - M was. Check this before trusting the
  subtraction.

  SENSITIVITY: the effect being measured is small (previous indirect estimate was
  1-2 points) against per-minute CPU noise of roughly +/-8 points. Hence 30-minute
  windows rather than 15, doubling CloudWatch samples per arm to ~30, and only
  three arms so total wall clock stays near 2h — well inside the 4h
  orphan-cleanup TTL. Even so, treat a result under ~2 points as "smaller than we
  can resolve", not as zero.

  Write load is held at 5 tables x 7 MB/s = 35 MB/s, identical to
  orders-5table-split / -readers / -baseline, so W and the scan toll stay
  comparable with those runs.

connector: oracledb_cdc
stack: oracle

infra:
  source:
    instance_class: db.r5.2xlarge
    storage_gb: 800
    iops: 24000
  runner:
    instance_type: c8g.4xlarge

dataset:
  initial_rows: 0
  row_size_bytes: 1200
  tables: [orders_t1, orders_t2, orders_t3, orders_t4, orders_t5]
  seeder: cdc-rows-oracle

workload:
  write_rate_per_sec: 30580   # 5 x 6116 rows/sec = 7.0 MB/s per table, 35 MB/s
  duration: 30m               # doubled from 15m for CPU-difference sensitivity
  warmup: 2m

pipeline:
  # NO `input` here, deliberately. mergePipeline recurses into maps and can only
  # add or replace keys, never remove them — a base input would survive into the
  # w0 arm alongside its `generate` and produce a two-input config that Connect
  # rejects only once it starts, ~10 minutes into a paid run. Every arm declares
  # its own complete input. Asserted by runner/oraclereturncost_test.go.
  cache_resources:
    - label: bench_checkpoint
      memory: {}

matrix:
  cpu_points: [4]
  arms:
    # M0 — mines everything, returns no DML.
    - id: m0-zero-tables
      gomaxprocs: 8
      streams: 1
      pipeline:
        input:
          oracledb_cdc:
            connection_string: ${ORACLE_DSN}
            include: ["BENCH.ORDERS_IDLE"]
            stream_snapshot: true
            checkpoint_cache: bench_checkpoint
            checkpoint_cache_key: oracle_idle
            batching:
              count: 5000
              period: 1s

    # A2 — same mining, plus 14 MB/s of returned rows. Under the single-reader
    # ceiling so mining coverage matches m0.
    - id: a2-two-tables
      gomaxprocs: 8
      streams: 1
      pipeline:
        input:
          oracledb_cdc:
            connection_string: ${ORACLE_DSN}
            include:
              - "BENCH.ORDERS_T1"
              - "BENCH.ORDERS_T2"
            stream_snapshot: true
            checkpoint_cache: bench_checkpoint
            checkpoint_cache_key: oracle_two
            batching:
              count: 5000
              period: 1s

    # W — no Oracle reader at all; `generate` keeps the pipeline valid while
    # touching Oracle not at all. Runs last: it is the unusual shape (a source
    # scenario whose input never reads the source), so the two informative arms
    # bank their results first.
    - id: w0-writes-only
      gomaxprocs: 8
      streams: 1
      pipeline:
        input:
          generate:
            interval: 10s
            mapping: 'root = {"baseline": "writes-only"}'

reset:
  # Truncate the five written tables and ensure the never-written ORDERS_IDLE
  # exists with supplemental logging for the m0 arm. Oracle has no psql/mysql
  # CLI on the runner, so each statement goes through the seeder's `exec`
  # subcommand; the CREATE/ALTER are PL/SQL blocks that swallow exceptions so
  # re-running between every sweep point is a no-op after the first.
  #
  # Reset runs on the RUNNER host while the seeder is staged on the LOAD-GEN
  # host, so self-stage it from the S3 key the seed phase uploaded to. The
  # binary is arm64 and the runner is Graviton.
  - bash: |
      aws s3 cp s3://${RESULTS_BUCKET}/stage/cdc-rows-oracle /opt/bench/cdc-rows-oracle
      chmod +x /opt/bench/cdc-rows-oracle
      for t in ORDERS_T1 ORDERS_T2 ORDERS_T3 ORDERS_T4 ORDERS_T5; do
        /opt/bench/cdc-rows-oracle exec --dsn "${ORACLE_DSN}" --sql "TRUNCATE TABLE BENCH.$t"
      done
      /opt/bench/cdc-rows-oracle exec --dsn "${ORACLE_DSN}" --sql "BEGIN EXECUTE IMMEDIATE 'CREATE TABLE BENCH.ORDERS_IDLE (id NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY, payload VARCHAR2(4000))'; EXCEPTION WHEN OTHERS THEN NULL; END;"
      /opt/bench/cdc-rows-oracle exec --dsn "${ORACLE_DSN}" --sql "BEGIN EXECUTE IMMEDIATE 'ALTER TABLE BENCH.ORDERS_IDLE ADD SUPPLEMENTAL LOG DATA (ALL) COLUMNS'; EXCEPTION WHEN OTHERS THEN NULL; END;"
