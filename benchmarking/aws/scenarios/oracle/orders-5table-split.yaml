name: oracle-orders-5table-split
description: |
  DISCRIMINATOR TEST — is the oracledb_cdc throughput limit the traversal of
  Oracle's single ordered redo stream, or the per-session fetch/parse of the
  rows that match a session's table filter?

  This question was never answerable from the earlier oracle/orders-cdc runs.
  Those runs' workload generator was ticker-gated and silently capped near
  ~10K rows/sec (~12 MB/s) regardless of the requested rate, so "Connect flat
  at 13 (later 19) MB/s across 1-8 vCPU" is equally consistent with "Connect
  simply kept pace with a load that was identical at every point". The seeder's
  workload path is now a continuous paced loop (mirroring bulkInsert, which
  sustained ~41 MB/s on this instance class) and logs delivered rows/sec and
  MB/s per table every 10s, so the read-side number can be read against the
  load that actually arrived.

  Load: 5 tables, ~7 MB/s of row data each, ~35 MB/s total. Note that redo
  volume is materially HIGHER than 35 MB/s: every table carries ADD
  SUPPLEMENTAL LOG DATA (ALL) COLUMNS, so redo also holds full before-images
  plus undo and index maintenance. That is deliberate — it matches what a
  customer running Debezium-style CDC actually generates.

  Arms (identical except for the input's include list):
    a-1table  — one input mining ONE of the 5 loaded tables.
    b-5tables — one input mining ALL 5.

  Reading the result:
    a ~= 7 and b ~= 35  -> no session ceiling near 19 at all; the old number was
                           load-bound. One input serves all 5 tables; no split.
    a ~= 7 and b ~= 19-25 -> a session CAN traverse a ~35 MB/s stream while
                           emitting only its own table, so the limit is
                           per-session fetch/parse of matched rows. Splitting
                           into N inputs raises aggregate throughput.
    a << 7              -> the session cannot even keep pace with the stream
                           while emitting one table's worth. Traversal-bound:
                           splitting buys nothing and ~19 MB/s is the real
                           aggregate ceiling for LogMiner.

  Cores are deliberately generous (4 vCPU, GOMAXPROCS 8, both arms) so that a
  shortfall cannot be mistaken for CPU starvation. This is a shape test, not a
  CPU sweep — cpu_points stays at a single value on purpose.

connector: oracledb_cdc
stack: oracle

infra:
  source:
    # RDS Oracle has NO Graviton support — x86 (db.r5) only, like SQL Server.
    # Same class as oracle/orders-cdc so read-side numbers stay comparable.
    instance_class: db.r5.2xlarge
    storage_gb: 800
    iops: 24000
  runner:
    instance_type: c8g.4xlarge

dataset:
  initial_rows: 0          # TRUNCATE-before-every-point makes a seed pointless;
                           # the seeder still runs once to CREATE all 5 tables,
                           # enable per-table supplemental logging, and grant
                           # the LogMiner privileges.
  row_size_bytes: 1200     # matches oracle/orders-cdc for comparability
  tables: [orders_t1, orders_t2, orders_t3, orders_t4, orders_t5]
  seeder: cdc-rows-oracle

workload:
  # TOTAL rows/sec across tables for THIS seeder (cdc-rows-oracle divides the
  # rate evenly and gives each table its own workers) — not per-table, unlike
  # the postgres/mysql seeders. 30580 = 5 tables x 6116 rows/sec, and
  # 6116 x 1200B = 7.0 MB/s per table, ~35 MB/s total.
  write_rate_per_sec: 30580
  duration: 15m
  warmup: 2m

pipeline:
  cache_resources:
    - label: bench_checkpoint
      memory: {}
  input:
    oracledb_cdc:
      connection_string: ${ORACLE_DSN}
      # Base = all 5 tables (arm b). Arm a overrides this list. Owning schema
      # is the RDS master user (BENCH), uppercased by Oracle.
      include:
        - "BENCH.ORDERS_T1"
        - "BENCH.ORDERS_T2"
        - "BENCH.ORDERS_T3"
        - "BENCH.ORDERS_T4"
        - "BENCH.ORDERS_T5"
      # stream_snapshot:true snapshots the (empty, post-TRUNCATE) tables —
      # instant, 0 rows — and captures CURRENT_SCN as the streaming start
      # position, so only redo produced AFTER startup is mined. See
      # oracle/orders-cdc for why stream_snapshot:false is a trap here.
      stream_snapshot: true
      checkpoint_cache: bench_checkpoint   # memory cache: fresh per launch, so
                                           # no arm can inherit another's SCN
      checkpoint_cache_key: oracle_bench
      batching:
        count: 5000
        period: 1s

matrix:
  cpu_points: [4]
  arms:
    - id: a-1table
      gomaxprocs: 8
      streams: 1
      pipeline:
        input:
          oracledb_cdc:
            # Mine ONE table while all 5 are being written. A list value
            # replaces (mergePipeline only recurses into maps), so this is the
            # whole include list, not an addition to the base's five.
            include:
              - "BENCH.ORDERS_T1"
    - id: b-5tables
      gomaxprocs: 8
      streams: 1
      # No pipeline override: inherits the base's 5-table include.

reset:
  # No replication slot to drop (LogMiner is slotless) and supplemental logging
  # survives TRUNCATE, so reset is just the truncates. Oracle has no psql/mysql-
  # style CLI on the runner, so these run through the seeder's `exec` subcommand
  # (go-ora) rather than a sql: step.
  #
  # Reset runs on the RUNNER host (matrix.go), but the seeder is only staged at
  # /opt/bench/ on the LOAD-GEN host during the seed phase. So self-stage the
  # seeder from the same S3 key the seed phase uploaded it to (stage/<seeder>).
  # The binary is GOARCH=arm64 and the runner is Graviton (c8g), so it runs
  # as-is. One exec per table: `exec` takes a single statement.
  - bash: |
      aws s3 cp s3://${RESULTS_BUCKET}/stage/cdc-rows-oracle /opt/bench/cdc-rows-oracle
      chmod +x /opt/bench/cdc-rows-oracle
      for t in ORDERS_T1 ORDERS_T2 ORDERS_T3 ORDERS_T4 ORDERS_T5; do
        /opt/bench/cdc-rows-oracle exec --dsn "${ORACLE_DSN}" --sql "TRUNCATE TABLE BENCH.$t"
      done
