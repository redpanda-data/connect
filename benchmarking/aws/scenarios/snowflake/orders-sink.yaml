name: snowflake-orders-sink
description: |
  Drain a pre-seeded Redpanda topic of flat JSON records into a Snowflake
  table via the snowflake_streaming output (Snowpipe Streaming), across a
  vCPU sweep. Throughput is server-side committed truth: snowflake-tablegen
  polls SHOW TABLES (metadata-only, no warehouse credits) for the table's
  bytes/rows every 10s. Bounded dataset (no sustained workload): the topic is
  the fixed input; each sweep point re-reads it from the beginning against a
  freshly CREATE OR REPLACEd table. Connect-only — no Kafka Connect
  counterpart is wired for this sink.

  Run the smoke scenario (orders-sink-smoke.yaml) first on a fresh setup;
  one-time SSM/Snowflake setup is in scenarios/snowflake/README.md.

direction: sink
connector: snowflake
stack: snowflake

infra:
  runner:
    instance_type: c8g.4xlarge

dataset:
  # Sized so the FASTEST point cannot drain the topic inside its 15-min
  # window: the buffered smoke measured ~15-20 MB/s at 1 vCPU (2026-08-18,
  # median 15.2 / peak 30.4), so near-linear scaling could reach ~200 MB/s
  # at 8 vCPU — 160M rows (~180 GiB) outlasts that. The 1-vCPU smoke's own
  # 12M rows drained ~3 min early and deflated its mean; don't repeat that
  # at sweep scale. Extra data costs only seed time; every point re-reads
  # the same topic from offset 0.
  initial_rows: 160000000
  row_size_bytes: 1200
  seeder: json-orders
  expected_peak_mb_s: 200

pipeline:
  # Same recipe the smoke validates; see orders-sink-smoke.yaml for the
  # buffer, batching, and schema_evolution rationale (the buffer is
  # essential: without it the input's checkpoint_limit chains reads to
  # Snowpipe commit latency and throughput collapses to ~44 rows/s).
  buffer:
    memory:
      limit: 524288000   # 500 MiB; size to throughput x commit interval
      batch_policy:
        count: 50000
        period: 10s
  output:
    snowflake_streaming:
      max_in_flight: 4
      batching:
        count: 50000
        period: 10s
      schema_evolution:
        enabled: false

matrix:
  cpu_points: [1, 2, 4, 8]
