name: postgres-orders-soak
description: |
  Soak: hold Connect at a fixed, sustained-moderate load (10K writes/sec ≈
  12 MB/s — roughly 10-15% of the ~100 MB/s ceiling orders-cdc's sweep
  measures) for 90 minutes at a single vCPU point. This is not a ceiling
  search; it exists to catch leaks, stalls, and log/metric-rotation bugs
  that a short max-load sweep point never runs long enough to hit.

  The connector authenticates with RDS IAM auth (aws.enabled below), not the
  master password: IAM tokens expire after ~15 minutes, so a 90-minute run
  crosses the token window six times — the credential-rotation bug class
  (#4668 postgres_cdc IAM heartbeat, #4258 mysql_cdc mid-snapshot expiry)
  that motivated soak testing in the first place. The seeder and reset steps
  keep using the master DSN.

connector: postgres_cdc
stack: postgres
soak: true

infra:
  source:
    instance_class: db.r6g.xlarge
    storage_gb: 200
    iops: 6000
    storage_throughput: 500     # gp3 MiB/s; ample headroom at this sustained rate
    iam_auth_enabled: true      # ~15-min IAM tokens = the rotation lever (see description)
    parameters:
      rds.logical_replication: "1"
      max_wal_senders: "20"
  runner:
    instance_type: c8g.xlarge   # 4 vCPU: reservedCores(2) + cpu_points[2] == 4

dataset:
  initial_rows: 0          # TRUNCATE keeps table size bounded; no seed needed
  row_size_bytes: 1200
  tables: [orders]
  seeder: cdc-rows-postgres

workload:
  write_rate_per_sec: 10000
  duration: 90m
  warmup: 5m

pipeline:
  input:
    postgres_cdc:
      # Passwordless DSN (bench_iam user); the aws block's token builder
      # supplies a fresh ~15-min IAM token as the password on (re)connect.
      dsn: ${POSTGRES_IAM_DSN}
      aws:
        enabled: true
        endpoint: ${POSTGRES_ENDPOINT}:5432   # BuildAuthToken wants host:port
        region: ${REGION}
      tls:
        skip_cert_verify: true   # RDS-internal CA isn't in the runner image; postgres_cdc uses NewTLSField (no `enabled` toggle)
      stream_snapshot: false
      schema: public
      tables: [orders]
      slot_name: bench_slot
      batching:
        count: 5000
        period: 1s

matrix:
  cpu_points: [2]

reset:
  # Reset runs as the MASTER user (rds_superuser), which can drop slots the
  # bench_iam connector created. Both slots are dropped even though soak runs
  # --engines=connect only, so a --keep re-run against a KC-touched instance
  # still starts clean.
  - sql: "SELECT pg_drop_replication_slot('bench_slot') FROM pg_replication_slots WHERE slot_name='bench_slot'"
  - sql: "SELECT pg_drop_replication_slot('kc_bench_slot') FROM pg_replication_slots WHERE slot_name='kc_bench_slot'"
  - sql: "TRUNCATE TABLE orders"
  # --- IAM-auth role setup (idempotent, master creds) ---
  # DO-string guards instead of $$-quoting: the SQL is rendered into a bash
  # double-quoted string (scripts.go uses %q), where $$ would expand to the
  # shell PID. Single quotes pass through double quotes untouched.
  - sql: "DO 'BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = ''bench_iam'') THEN CREATE ROLE bench_iam WITH LOGIN; END IF; END';"
  - sql: "GRANT rds_iam TO bench_iam"          # RDS: allow IAM-token login
  - sql: "GRANT rds_replication TO bench_iam"  # slot create + logical streaming
  - sql: "GRANT USAGE ON SCHEMA public TO bench_iam"
  - sql: "GRANT SELECT ON ALL TABLES IN SCHEMA public TO bench_iam"
  # CREATE on the DB is required for bench_iam to own the publication below.
  - sql: "GRANT CREATE ON DATABASE benchdb TO bench_iam"
  # Pre-create the publication (name = pglog_stream_<slot_name>) with EXACTLY
  # the connector's table list: postgres_cdc's CreatePublication then no-ops
  # (docs bless pre-creation to avoid granting create rights to the
  # replication user). Ownership goes to bench_iam so that even a table-list
  # drift ends in an ALTER it is allowed to attempt, not a permissions error.
  - sql: "DO 'BEGIN IF NOT EXISTS (SELECT FROM pg_publication WHERE pubname = ''pglog_stream_bench_slot'') THEN CREATE PUBLICATION pglog_stream_bench_slot FOR TABLE public.orders; END IF; END';"
  - sql: "ALTER PUBLICATION pglog_stream_bench_slot OWNER TO bench_iam"
