name: iceberg-7table-fanin-vs-streams
description: 7-topic streams7 vs fanin fixture
direction: sink
connector: iceberg
stack: iceberg

infra:
  runner:
    instance_type: c8g.4xlarge

dataset:
  # 119M rows / 7 topics = 17M rows/topic @ 1200B -> ~143GB total. See the
  # 7-table consolidation design doc's Sizing section for the arithmetic.
  initial_rows: 119000000
  row_size_bytes: 1200
  seeder: json-orders
  expected_peak_mb_s: 145
  topics: 7

pipeline:
  buffer:
    memory:
      limit: 524288000
      batch_policy:
        count: 10000
        period: 10s
  output:
    iceberg:
      max_in_flight: 16
      batching:
        count: 10000
        period: 10s
      commit:
        max_snapshot_age: 24h

matrix:
  cpu_points: [2, 4]
  arms:
    - id: streams7
      streams: 7
    - id: fanin
      fan_in: true
      pipeline:
        output:
          iceberg:
            max_in_flight: 16
            batching:
              count: 70000
              period: 10s
