version: '3'

vars:
  # The runner lives in this directory's standalone Go module (see go.mod
  # here — its AWS SDK deps must stay out of the published root module), so
  # it can't be `go run` from the repo root. Build it here, run it there:
  # the runner expects --repo-root and scenario paths relative to the root.
  RUNNER_BUILD: 'RUNNER_BIN="$(mktemp -d)/bench-runner" && go build -o "$RUNNER_BIN" ./runner'
  RUNNER: '"$RUNNER_BIN"'

tasks:
  aws:bench:
    desc: "Run a scenario end-to-end (provision → sweep → render → teardown)"
    dir: '.'
    cmds:
      # scenario=<name> runs scenarios/<name>.yaml. scenario_file=<abs path>
      # runs a scenario outside the repo — Bench Bot renders its plans into
      # $RUNNER_TEMP so the checkout stays clean and its catalogue entry is
      # not skipped as a dirty-tree build.
      - |
        if [ -n "{{.scenario}}" ] && [ -n "{{.scenario_file}}" ]; then
          echo "usage: pass scenario=<name> or scenario_file=<abs path>, not both"
          exit 2
        fi
        if [ -n "{{.scenario_file}}" ]; then
          case "{{.scenario_file}}" in
            /*) SCENARIO_PATH="{{.scenario_file}}" ;;
            *) echo "scenario_file must be an absolute path"; exit 2 ;;
          esac
        elif [ -n "{{.scenario}}" ]; then
          SCENARIO_PATH="benchmarking/aws/scenarios/{{.scenario}}.yaml"
        else
          echo "usage: task aws:bench scenario=<path> | scenario_file=<abs path>"
          exit 2
        fi
        {{.RUNNER_BUILD}}
        cd ../.. && {{.RUNNER}} bench \
          --scenario="$SCENARIO_PATH" \
          --repo-root=. \
          {{.extra_flags}}

  aws:validate:
    desc: "Validate a scenario YAML + terraform plan (no AWS spend)"
    cmds:
      - |
        if [ -z "{{.scenario}}" ]; then
          echo "usage: task aws:validate scenario=<path>"
          exit 2
        fi
        {{.RUNNER_BUILD}}
        cd ../.. && {{.RUNNER}} validate \
          --scenario=benchmarking/aws/scenarios/{{.scenario}}.yaml

  aws:down:
    desc: "Tear down infra for a scenario (when bench was run with keep=true)"
    cmds:
      - |
        if [ -z "{{.scenario}}" ]; then
          echo "usage: task aws:down scenario=<path>"
          exit 2
        fi
        {{.RUNNER_BUILD}}
        cd ../.. && {{.RUNNER}} down \
          --scenario=benchmarking/aws/scenarios/{{.scenario}}.yaml \
          --repo-root=.

  aws:persistent:
    desc: "Apply the persistent stack (soak dashboards; later alarms). Outside the per-run lifecycle — apply once and on change, never torn down by aws:down."
    cmds:
      # cleanup.tf reads bootstrap.zip at plan time (filebase64sha256), and
      # the zip is gitignored — build it here so a fresh checkout can apply
      # without knowing about the Makefile.
      - make -C cleanup-lambda zip
      # -reconfigure: same reasoning as runner/terraform.go Init — the full
      # backend config is on the command line, and without the flag a
      # backend.hcl change strands every existing .terraform/ working dir.
      - terraform -chdir=terraform/persistent init -input=false -reconfigure -backend-config=../backend.hcl -backend-config=key=persistent
      - terraform -chdir=terraform/persistent apply -input=false -auto-approve

  aws:cost-check:
    desc: "Show AWS Cost Explorer spend for the bench project (today/7d/MTD)"
    cmds:
      - '{{.RUNNER_BUILD}} && cd ../.. && {{.RUNNER}} cost-check'

  aws:summary:
    desc: "Regenerate the auto-managed AWS section in docs/benchmark-results/SUMMARY.md"
    cmds:
      - '{{.RUNNER_BUILD}} && cd ../.. && {{.RUNNER}} summary --repo-root=.'

  aws:test:
    desc: "Run the benchmarking module's unit tests (standalone module — not covered by the repo root's `task test`)"
    cmds:
      - go test -timeout 5m -shuffle=on ./...

  aws:tf-clean:
    desc: "Remove .terraform/ caches under benchmarking/aws/terraform/ (use when a backend or provider config change confuses init)"
    cmds:
      - find terraform -type d -name '.terraform' -exec rm -rf {} +
      - find terraform -type f -name '.terraform.lock.hcl' -delete
      - echo "terraform caches cleaned; next aws:bench will re-init"

  catalog:query:
    desc: "Query the benchmark results catalogue (task catalog:query -- --input postgres_cdc --output redpanda --message-size 1200)"
    dir: '.'
    cmds:
      - go run ./cmd/catalog query {{.CLI_ARGS}}

  catalog:recommend:
    desc: "Recommend CUs for a catalogue entry (task catalog:recommend -- --entry-id ID --target-mb-s 40)"
    dir: '.'
    cmds:
      - go run ./cmd/catalog recommend {{.CLI_ARGS}}

  catalog:import:
    desc: "Import historical bench results into the catalogue (task catalog:import -- --results-root DIR --scenarios-root DIR --repo ../..)"
    dir: '.'
    cmds:
      - go run ./cmd/catalog import {{.CLI_ARGS}}
